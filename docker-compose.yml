services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8080"
    volumes:
      - ./:/app
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

